# Builds the landing page in site/ (Next.js static export) and publishes it to GitHub Pages.
# Runs when the site changes, and hourly to pick up newly published releases: releases are
# created by the Release workflow (GITHUB_TOKEN), and GitHub doesn't start workflows from
# events caused by that token, so `release: published` alone never fires for them.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  release:
    types: [published, edited]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Hourly runs only rebuild when the latest release isn't on the site yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || echo none)
          live=$(curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.txt" 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "latest=$latest live=$live"
          if [ "$latest" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Reads the releases from the GitHub API without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
