<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Strata app icon: three glass layers with a glowing dot, on a dark macOS squircle.
       Logo geometry matches src/components/StrataLogo.tsx (120×120 units). -->
  <defs>
    <linearGradient id="bg" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#2D2E38"/>
      <stop offset="0.55" stop-color="#15161B"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass fills: brighter at the top edge, like light catching the plane. -->
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8EFF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B08CFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FE3CF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="planeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="blurS" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="blurL" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>

    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Squircle background -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <circle cx="512" cy="500" r="330" fill="url(#halo)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Logo, in StrataLogo units: centered, 5.4× -->
  <g transform="translate(188 176) scale(5.4)">
    <!-- bottom (teal), middle (violet), top (indigo) -->
    <g filter="url(#planeShadow)">
      <g transform="translate(60 80) scale(1 0.58) rotate(45)">
        <rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#teal)" stroke="#7DE6D7" stroke-opacity="0.65" stroke-width="1.6"/>
      </g>
    </g>
    <g filter="url(#planeShadow)">
      <g transform="translate(60 60) scale(1 0.58) rotate(45)">
        <rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#violet)" stroke="#C8AFFF" stroke-opacity="0.65" stroke-width="1.6"/>
      </g>
    </g>
    <g filter="url(#planeShadow)">
      <g transform="translate(60 40) scale(1 0.58) rotate(45)">
        <rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#indigo)" stroke="#AFB2FF" stroke-opacity="0.75" stroke-width="1.6"/>
      </g>
    </g>

    <!-- The line that connects all three views -->
    <rect x="59.4" y="40" width="1.2" height="62" rx="0.6" fill="url(#beam)"/>

    <!-- Glowing dot -->
    <circle cx="60" cy="40" r="13" fill="#6366F1" opacity="0.55" filter="url(#blurL)"/>
    <circle cx="60" cy="40" r="7" fill="#818CF8" opacity="0.95" filter="url(#blurS)"/>
    <circle cx="60" cy="40" r="6.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.6"/>
    <circle cx="60" cy="40" r="5" fill="#FFFFFF"/>
  </g>
</svg>
