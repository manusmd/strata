# Builds Strata for macOS (Apple Silicon + Intel), signs the update package and
# creates a draft GitHub release with the DMG, the update package and latest.json.
# Publish the draft to ship it: installed apps pick it up through the updater.
#
# Start it by pushing a tag that matches the version in tauri.conf.json (e.g. v0.2.0),
# or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update package (Strata.app.tar.gz) so installed apps accept it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Strata v__VERSION__
          releaseDraft: true
          prerelease: false
          # One universal build: latest.json then lists it for both darwin-aarch64 and darwin-x86_64.
          args: --target universal-apple-darwin
          releaseBody: |
            ## Install

            1. Download the **.dmg** below and drag Strata into Applications.
            2. On first launch macOS can't verify the app (it isn't notarized): open **System Settings → Privacy & Security** and click **Open Anyway**.

            Already installed? Strata offers this update in the app.

            See the [README](https://github.com/manusmd/strata#install) if macOS says the app is damaged.
